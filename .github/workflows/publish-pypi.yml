name: Build and publish PPBase platform wheels

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'setup.py'
      - 'publish.sh'
      - 'admin-ui/**'
      - 'ppbase/backup/tools.py'
      - 'ppbase/backup/postgres.py'
      - 'ppbase/backup/provision.py'
      - 'ppbase/_vendor/postgresql/**'
      - 'scripts/postgresql-source.json'
      - 'scripts/licenses/**'
      - 'scripts/vendor_postgresql.py'
      - 'scripts/repair_wheel.py'
      - 'scripts/smoke_test_wheel.py'
      - 'scripts/smoke_test_postgresql_compat.py'
      - 'scripts/verify_release_artifacts.py'
      - 'scripts/verify_pypi_release.py'
      - 'tests/test_backup_tools.py'
      - 'tests/conftest.py'
      - 'tests/integration/test_backup_provision.py'
      - 'tests/test_release_artifacts.py'
      - '.github/workflows/publish-pypi.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-assets:
    name: Build Admin UI assets once
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Build deterministic Admin UI payload
        working-directory: admin-ui
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-ui-dist
          path: ppbase/admin/dist
          if-no-files-found: error

  linux-wheels:
    name: Linux ${{ matrix.arch }} wheel
    needs: admin-assets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: admin-ui-dist
          path: ppbase/admin/dist
      - name: Enable ARM emulation
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Build and smoke-test wheel
        uses: pypa/cibuildwheel@faf86a6ed7efa889faf6996aa23820831055001a # v2.23.3
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppbase-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  macos-wheels:
    name: macOS ${{ matrix.arch }} wheel
    needs: admin-assets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: admin-ui-dist
          path: ppbase/admin/dist
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build and smoke-test wheel
        uses: pypa/cibuildwheel@faf86a6ed7efa889faf6996aa23820831055001a # v2.23.3
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          # Homebrew OpenSSL is native to the macOS 15 builders. Tag the wheel
          # truthfully instead of claiming compatibility with an older SDK.
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppbase-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  source-distribution:
    name: Build unsupported-platform source guard
    needs: admin-assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: admin-ui-dist
          path: ppbase/admin/dist
      - name: Build the source guard for unsupported platforms
        run: |
          python -m pip install --disable-pip-version-check 'build==1.2.2.post1'
          pyproject-build --sdist --outdir dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppbase-source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  postgresql-compatibility:
    name: PostgreSQL ${{ matrix.postgres }} functional smoke
    needs: [linux-wheels, macos-wheels]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ppbase-wheel-smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ppbase-linux-*
          path: wheelhouse
          merge-multiple: true
      - name: pip install ppbase and round-trip a real dump with an empty PATH
        env:
          PGPASSWORD: ppbase-wheel-smoke
        run: >-
          python scripts/smoke_test_postgresql_compat.py
          --wheelhouse wheelhouse
          --server-major ${{ matrix.postgres }}

  postgresql-provisioning:
    name: PostgreSQL ${{ matrix.postgres }} provisioning integration
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ppbase-provision-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install PPBase test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Exercise provisioning against a real PostgreSQL superuser
        env:
          PPBASE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ppbase-provision-test@127.0.0.1:5432/postgres
        run: pytest tests/integration/test_backup_provision.py -q

  verify-release-set:
    name: Verify single-project release set
    needs: [linux-wheels, macos-wheels, source-distribution, postgresql-compatibility, postgresql-provisioning]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ppbase-*
          path: dist
          merge-multiple: true
      - name: Verify all five files use one ppbase name and version
        if: github.event_name != 'release'
        run: python scripts/verify_release_artifacts.py dist
      - name: Verify release tag and all five files
        if: github.event_name == 'release'
        run: python scripts/verify_release_artifacts.py dist --release-tag "${{ github.event.release.tag_name }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppbase-release-files
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ppbase with PyPI Trusted Publishing
    if: github.event_name == 'release'
    needs: verify-release-set
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ppbase
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ppbase-release-files
          path: dist
      - name: Publish the single ppbase project/version
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          skip-existing: true
      - name: Verify the complete immutable PyPI release
        run: >-
          python scripts/verify_pypi_release.py dist
          --version "${{ github.event.release.tag_name }}"
          --retries 12 --delay 10
