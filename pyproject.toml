[project]
name = "ppbase"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "lark>=1.2.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "boto3>=1.35.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.0",
    "pillow>=11.0.0",
    "wheel>=0.45.1",
]

[project.scripts]
ppbase = "ppbase.__main__:main"

[tool.setuptools.packages.find]
include = ["ppbase*"]

[tool.setuptools.package-data]
"ppbase" = [
    "admin/dist/**/*",
    "_vendor/postgresql/*.json",
    "_vendor/postgresql/*.md",
    "_vendor/postgresql/bin/*",
    "_vendor/postgresql/licenses/*",
]

[tool.cibuildwheel]
# The payload is Python-ABI independent, so one CPython build is deliberately
# retagged by setup.py as py3-none-<platform>.  Building it four times produces
# the four files published under the same ppbase project and version.
build = "cp311-*"
skip = "*-musllinux_*"
build-verbosity = 1
before-build = "python {project}/scripts/vendor_postgresql.py --dest {project}/ppbase/_vendor/postgresql --work-dir {project}/build/postgresql-vendor"
test-command = "python {project}/scripts/smoke_test_wheel.py"
environment = { PPBASE_BUILD_PLATFORM_WHEEL = "1", SOURCE_DATE_EPOCH = "1778112000" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "dnf install -y openssl openssl-devel zlib-devel perl"
repair-wheel-command = "python {project}/scripts/repair_wheel.py --platform linux --wheel {wheel} --dest-dir {dest_dir}"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
before-all = "brew install openssl@3"
repair-wheel-command = "python {project}/scripts/repair_wheel.py --platform macos --wheel {wheel} --dest-dir {dest_dir}"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=75.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"
